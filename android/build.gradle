group 'com.zinonsoftware.video_compressor_plus'
version '1.0-SNAPSHOT'

buildscript {
    ext.kotlin_version = '2.2.20'
    repositories {
        google()
        mavenCentral()
    }

    dependencies {
        classpath 'com.android.tools.build:gradle:8.11.1'
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
    }
}

rootProject.allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

apply plugin: 'com.android.library'

// --- Built-in Kotlin compatibility (Nimbus fork) -----------------------------
// AGP 9+ compiles Kotlin itself ("built-in Kotlin"); applying the Kotlin Gradle
// Plugin on top of it is a fatal error in KGP 2.4+. So KGP is applied only when
// built-in Kotlin is NOT in charge: AGP < 9, or an app that opted out with
// `android.builtInKotlin=false`. An absent property means AGP's default, which
// is built-in Kotlin on AGP 9+ (and the only mode on AGP 10).
//
// Applied via `pluginManager` rather than an `apply plugin:` line on purpose:
// Flutter's `detectApplyingKotlinGradlePlugin` regex-matches this file's text,
// so even a conditional `apply plugin:` line is reported as unconditional.
// https://docs.flutter.dev/release/breaking-changes/migrate-to-built-in-kotlin/for-plugin-authors
def agpMajor = com.android.Version.ANDROID_GRADLE_PLUGIN_VERSION.tokenize('.')[0].toInteger()
def builtInKotlinProp = project.findProperty('android.builtInKotlin')?.toString()
def builtInKotlinEnabled = agpMajor >= 9 && builtInKotlinProp != 'false'
if (!builtInKotlinEnabled) {
    project.pluginManager.apply('kotlin-android')
}

android {
    namespace 'com.zinonsoftware.video_compressor_plus'
    
    // Conditional for compatibility with AGP <4.2.
    if (project.android.hasProperty("namespace")) {
        namespace 'com.zinonsoftware.video_compressor_plus'
    }
    
    compileSdk 36

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
    }
    defaultConfig {
        minSdkVersion 21
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }
    lint {
        disable 'InvalidPackage'
    }
}

dependencies {
    implementation "org.jetbrains.kotlin:kotlin-stdlib-jdk8:$kotlin_version"
    implementation 'com.otaliastudios:transcoder:0.11.2'
}

// `kotlinOptions` inside `android {}` only exists when KGP is applied; the
// top-level `kotlin` extension exists in both modes (KGP or built-in Kotlin).
kotlin {
    compilerOptions {
        jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17
    }
}
